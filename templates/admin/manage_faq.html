{% extends 'admin/base.html' %}
{% load static %}

{% block title %}Admin - Manage FAQ - TuloyEskwelaPDBNHS{% endblock %}

{% block content %}
<div class="pagetitle">
    <h1>FAQ</h1>
    <nav>
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'admin_dashboard' %}">Home</a></li>
            <li class="breadcrumb-item active">FAQ</li>
        </ol>
    </nav>
</div><!-- End Page Title -->

<section class="section">
    <div class="row">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Manage FAQ</h5>
                    <div class="d-flex justify-content-end mb-3">
                        <!-- <button type="button" class="btn btn-outline-primary" id="filter-container-btn">
                            <i class="bi bi-funnel"></i>
                            <span>Filter</span>
                        </button> -->
                        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addFAQModal">
                            <i class="bi bi-plus-lg"></i>
                            FAQ
                        </button>
                    </div>
                    <!-- <div class="filter-container" id="filter-container" style="display: none;">
                        <div class="filter-form">
                            <div class="filter-group">
                                <label for="filter-announcement-status">Announcement Status</label>
                                <select class="form-select" id="filter-announcement-status" name="announcement_status">
                                    <option value="">All</option>
                                    <option value="Active">Active</option>
                                    <option value="Inactive">Inactive</option>
                                </select>
                            </div>
                            <button class="clear-filter-button" type="button" id="clearFilters">
                                Clear Filters
                            </button>
                        </div>
                    </div> -->
                    <table class="table table-striped table-hover table-bordered my-3" id="faqTable">
                        <thead>
                            <tr>
                                <th></th>
                                <th>Question</th>
                                <th>Answer</th>
                                <th>Created At</th>
                                <th>Updated At</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Add FAQ Modal -->
<div class="modal fade" id="addFAQModal" tabindex="-1" aria-labelledby="addFAQModal" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="addFAQForm">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title" id="addFAQModal">Add FAQ</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="question" class="form-label">Question</label>
                        <input type="text" class="form-control" name="question" placeholder="Your question here">
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                        <label for="answer" class="form-label">Answer</label>
                        <textarea class="form-control" name="answer" rows="3" placeholder="Your answer here"></textarea>
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="d-flex justify-content-center mb-3">
                        <button type="submit" class="btn btn-outline-primary" style="width: 30%;" id="saveButton">Save</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Edit FAQ Modal tinymce-editor -->
<div class="modal fade" id="editFAQModal" tabindex="-1" aria-labelledby="editFAQModal" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <form id="editFAQForm">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title">Edit FAQ</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="question" class="form-label">Question</label>
                        <input type="text" class="form-control" name="question" id="question">
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                        <label for="answer" class="form-label">Answer</label>
                        <textarea class="form-control" name="answer" rows="3" style="height: 200px; resize: none;" id="answer"></textarea>
                        <div class="invalid-feedback"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-success" id="editFAQButton">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>
  
<script src="{% static 'js/admin/faq-manager.js' %}"></script>
{% endblock %}
