{% extends 'admin/base.html' %}
{% load static %}
{% load tz %}
{% block content %}
<div class="pagetitle">
    <h1>User Management</h1>
    <nav>
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'admin_dashboard' %}">Home</a></li>
            <li class="breadcrumb-item active">All Users</li>
        </ol>
    </nav>
</div>
<section class="section">
    <div class="row">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Manage All Users</h5>
                    <div class="d-flex justify-content-start mb-3">
                        <button type="button" class="btn btn-outline-primary" id="filter-container-btn">
                            <i class="bi bi-funnel"></i>
                            <span>Filter</span>
                        </button>
                    </div>
                    <div class="filter-container" id="filter-container" style="display: none;">
                        <div class="filter-form">
                            <div class="filter-group">
                                <label for="filter-user-role">User Role</label>
                                <select class="form-select" id="filter-user-role" name="user_role">
                                    <option value="">All</option>
                                    <option value="Applicant">Applicant</option>
                                    <option value="Student">Student</option>
                                    <option value="Teacher">Teacher</option>
                                    <option value="Coordinator">Coordinator</option>    
                                    <option value="Administrator">Administrator</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label for="filter-is-active">Active</label>
                                <select class="form-select" id="filter-is-active" name="is_active">
                                    <option value="">All</option>
                                    <option value="Yes">Yes</option>
                                    <option value="No">No</option>
                                </select>
                            </div>
                            <button class="clear-filter-button" type="button" id="clearFilters">
                                Clear Filters
                            </button>
                        </div>
                    </div>
                    <table class="table table-striped table-hover table-bordered my-3" id="allUsersTable">
                        <thead>
                            <tr>
                                <th></th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>User Role</th>
                                <th>Account Created</th>
                                <th>Last Login</th>
                                <th>Active</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Change Password Modal -->
<div class="modal fade" id="changePasswordModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="changePasswordForm">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title">Change Password</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-12">
                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="currentPassword" name="current_password"
                                    placeholder="Password">
                                <label for="currentPassword">Current Password</label>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="newPassword" name="new_password"
                                    placeholder="Password">
                                <label for="newPassword">New Password</label>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="confirmPassword" name="confirm_password"
                                    placeholder="Password">
                                <label for="confirmPassword">Confirm New Password</label>
                            </div>
                        </div>
                    </div>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-success change-password-btn" >Save</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="{% static 'js/admin/user_manager.js' %}"></script>
{% endblock %}
