{% extends 'coordinator/base.html' %}
{% load static %}
{% block content %}

<div class="pagetitle">
    <h1>Grade {{ grade }} - School Year</h1>
    <nav>
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'assessment_view' %}">Home</a></li>
            <li class="breadcrumb-item active">Grade {{ grade }} </li>
        </ol>
    </nav>
</div>
<section class="section">
    <div class="row">
        {% for school_year in school_years %}
        <div class="col-sm-2">
            <div class="card-2 text-center card">
                <a href="{% url 'grade_level' grade=grade school_year=school_year.name %}"
                    class="text-decoration-none">
                    <div class="card-body p-0">
                        <h5 class="card-title text-dark" >S.Y. {{ school_year.name }}</h5>
                    </div>
                </a>
            </div>
        </div>
        {% empty %}
        <p class="text-center">No school years available for this grade.</p>
        {% endfor %}
    </div>
</section>
