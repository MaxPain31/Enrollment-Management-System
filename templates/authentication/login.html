{% load static %}
<div class="modal fade" id="loginModalToggle" aria-hidden="true" aria-labelledby="loginModalToggleLabel" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-body">
                <div class="d-flex align-items-center justify-content-end">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="d-flex align-items-center justify-content-center">
                    <img src="{% static "img/logo.png" %}" alt="logo" style="width: 50px;">
                </div>
                <h2 class="modal-title text-center mb-4">Login Student Account</h2>
                <form id="loginForm" method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div id="loginMessages"></div>
                    <div id="loginUnverifiedNotice" class="alert alert-warning d-none">
                        Please verify your email (<span id="loginUnverifiedEmail"></span>) before logging in.
                        <div class="mt-2">
                            <button type="button" class="btn btn-link p-0" id="loginResendVerificationBtn">
                                Resend verification email
                            </button>
                        </div>
                        <div id="loginResendVerificationFeedback" class="mt-2 small"></div>
                    </div>
                    <div class="mb-2">
                        <label for="lrn" class="form-label">Learner Reference Number</label>
                        <input type="text" class="form-control" id="lrn" name="lrn" placeholder="Enter your LRN">
                        <div class="invalid-feedback login-error"></div>
                    </div>
                    <div class="mb-2">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password" name="password"
                                placeholder="Enter your password">
                            <button class="btn hide-password" type="button" id="togglePassword">
                                <i class="bi bi-eye" id="toggleIcon"></i>
                            </button>
                            <div class="invalid-feedback login-error"></div>
                        </div>
                    </div>
                    <div class="mb-3 text-center">
                        <a href="{% url 'password_reset_request' %}" class="link-primary small">Forgot password?</a>
                    </div>
                    <div class="mb-2 form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">Remember me</label>
                    </div>
                    <div class="d-flex align-items-center justify-content-center gap-2 my-4">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" id="loginButton" class="btn btn-primary">Login</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="{% static 'js/login.js' %}"></script>
<style>
    /* Hide Password Button */
    .hide-password {
        border-radius: 0.375rem;
        border: 1px solid #dee2e6;
        background-color: #f8f9fa;
        color: #212529;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    
    .hide-password:hover {
        background-color: #e2e8f0;
    }
</style>
