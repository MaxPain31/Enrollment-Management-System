{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset Password</title>
    <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card border-0 shadow-sm overflow-hidden">
            <div class="row g-0">
              <div class="col-12">
                <div class="card-body p-4">
                  <div class="d-flex align-items-center gap-3 mb-3">
                    <div class="bg-primary bg-opacity-10 text-primary d-inline-flex align-items-center justify-content-center rounded-circle" style="width:48px; height:48px;">
                      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-lock" viewBox="0 0 16 16">
                        <path d="M8 1a2 2 0 0 0-2 2v3H5a1 1 0 0 0-1 1v6a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V7a1 1 0 0 0-1-1H10V3a2 2 0 0 0-2-2zm1 5V3a1 1 0 0 0-2 0v3h2z"/>
                      </svg>
                    </div>
                    <h3 class="card-title m-0">Create a new password</h3>
                  </div>
                  <p class="text-muted mb-4">
                    Choose a strong password to keep your account secure. This reset link stays active for only 10 minutes.
                  </p>
                  {% if error %}
                    <div class="alert alert-danger" role="alert">
                      {{ error }}
                    </div>
                  {% endif %}
                  <form method="post" action="" class="row gy-3">
                    {% csrf_token %}
                    <div class="col-12">
                      <label class="form-label" for="password">New password</label>
                      <input type="password" id="password" name="password" class="form-control" placeholder="Enter new password" required />
                    </div>
                    <div class="col-12">
                      <label class="form-label" for="confirm_password">Confirm new password</label>
                      <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter new password" required />
                    </div>
                    <div class="col-12 d-flex flex-column flex-sm-row gap-2">
                      <a href="/" class="btn btn-outline-secondary flex-fill">Cancel</a>
                      <button type="submit" class="btn btn-primary flex-fill">Update password</button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  </body>
</html>
